[package]
name = "buzz-gpui"
description = "Native Buzz client with local and remote agent management"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "buzz-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
# The terminal panel's VT state (Apache-2.0); drawn by the app itself.
alacritty_terminal = { version = "0.26", default-features = false }
blurhash = "0.2"
buzz-agent-controller.workspace = true
buzz-keychain = { path = "../keychain" }
buzz-desktop.workspace = true
buzz-host = { path = "../host" }
buzz-host-rpc = { path = "../host-rpc" }
buzz-identity = { path = "../identity" }
buzz-pair-mobile = { path = "../pair-mobile" }
buzz-relay-client = { path = "../relay" }
serde_json = "1"
buzz-ui = { path = "../ui" }
buzzodz-plugins.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Draws emoji avatars from the bundled emoji font; GPUI already uses it.
cosmic-text = "0.19"
dirs = "6"
emojis = "0.9"
futures = "0.3"
libc = "0.2"
gpui-kit.workspace = true
# For what gpui-kit does not re-export: the vendored text field's
# concealed ranges (third_party/README.md).
gpui-base = "=0.7.1"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
# Parses GitHub body HTML inertly, as buzz-app's `<template>` does;
# already built for GPUI's Markdown view.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
# The frame type inside GPUI's RenderImage, at GPUI's version.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
markdown = "1"
# Todo assignees name keys as buzz-app does, without a curve check.
bech32 = "0.11"
nostr = { version = "=0.45.5", default-features = false, features = ["std"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The launch mark's SMIL tracks.
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
# Release tags against the running version, for updates.
semver = "1"
sha2 = "0.10"
# The voice-note encoder writes into a private directory of its own.
tempfile = "3"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
toml = "0.9"
toml_edit = "0.25"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
# Paused time for timing tests.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# GPUI's Linux platform, for raising the window with a handed-over
# activation token (third_party/README.md).
gpui-pre-linux = "=0.3.8"
# Already comes with GPUI on Linux.
zbus = "5"
# "Copy image": GPUI's clipboard offers only text on Wayland.
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Machine-wide idle time, as buzz-app reads it there.
user-idle = { version = "0.6", default-features = false }
# "Copy image", as on Linux.
arboard = "3"
# The menu-bar or notification-area icon; Tauri's tray.
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
# The user's `buzz://` registration; GPUI already uses it.
windows-registry = "0.6"

[target.'cfg(windows)'.build-dependencies]
# The executable's icon; GPUI already uses it for its manifest.
embed-resource = "3"

[package.metadata.deb]
name = "buzz-gpui"
maintainer = "Ben Carman <benthecarman@live.com>"
copyright = "2026, Buzz GPUI contributors; portions © Block, Inc."
license-file = ["../../LICENSE", "0"]
extended-description = "Native Buzz client: chat with your communities and manage agents on this computer and on remote buzzd hosts."
section = "net"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon-x11-0, libwayland-client0, libfontconfig1, libdbus-1-3, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav, ffmpeg, gnome-keyring | kwalletmanager | keepassxc"
assets = [
    ["target/release/buzz-gpui", "usr/bin/", "755"],
    ["../../packaging/linux/buzz-gpui.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/buzz-128.png", "usr/share/icons/hicolor/128x128/apps/buzz-gpui.png", "644"],
    ["../../assets/icons/buzz-256.png", "usr/share/icons/hicolor/256x256/apps/buzz-gpui.png", "644"],
    ["../../assets/icons/buzz-512.png", "usr/share/icons/hicolor/512x512/apps/buzz-gpui.png", "644"],
    # Staged by scripts/package-deb.sh: Buzz's own Node plugins and the
    # Node that runs them.
    ["target/release/bundle/node/bin/node", "usr/lib/buzz-gpui/node/bin/", "755"],
    ["target/release/bundle/node/LICENSE", "usr/lib/buzz-gpui/node/", "644"],
    ["target/release/bundle/plugins/**/*", "usr/share/buzz-gpui/plugins/", "644"],
]
