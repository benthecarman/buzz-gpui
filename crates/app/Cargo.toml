[package]
name = "buzz-gpui"
description = "Native Buzz client with local and remote agent management"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "buzz-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blurhash = "0.2"
buzz-credential-store.workspace = true
buzz-host = { path = "../host" }
buzz-host-rpc = { path = "../host-rpc" }
buzz-identity = { path = "../identity" }
buzz-relay-client = { path = "../relay" }
serde_json = "1"
buzz-ui = { path = "../ui" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
emojis = "0.9"
futures = "0.3"
libc = "0.2"
gpui-kit.workspace = true
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
# The frame type inside GPUI's RenderImage, at GPUI's version.
image = { version = "0.25", default-features = false, features = ["png"] }
markdown = "1"
nostr = { version = "=0.45.5", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The launch mark's SMIL tracks.
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.9"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# GPUI's Linux platform, for raising the window with a handed-over
# activation token (third_party/README.md).
gpui-pre-linux = "=0.3.8"
# Already comes with GPUI on Linux.
zbus = "5"

[package.metadata.deb]
name = "buzz-gpui"
maintainer = "Ben Carman <benthecarman@live.com>"
copyright = "2026, Buzz GPUI contributors; portions © Block, Inc."
license-file = ["../../LICENSE", "0"]
extended-description = "Native Buzz client: chat with your communities and manage agents on this computer and on remote buzzd hosts."
section = "net"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon-x11-0, libwayland-client0, libfontconfig1, libdbus-1-3, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav, gnome-keyring | kwalletmanager | keepassxc"
assets = [
    ["target/release/buzz-gpui", "usr/bin/", "755"],
    ["../../packaging/linux/buzz-gpui.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/buzz-128.png", "usr/share/icons/hicolor/128x128/apps/buzz-gpui.png", "644"],
    ["../../assets/icons/buzz-256.png", "usr/share/icons/hicolor/256x256/apps/buzz-gpui.png", "644"],
    ["../../assets/icons/buzz-512.png", "usr/share/icons/hicolor/512x512/apps/buzz-gpui.png", "644"],
]
