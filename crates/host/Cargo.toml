[package]
name = "buzz-host"
description = "Agent host: runs Buzz agents on this machine and serves them over host-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
buzz-agent-controller.workspace = true
buzz-keychain = { path = "../keychain" }
buzz-desktop.workspace = true
buzz-host-rpc = { path = "../host-rpc" }
base64 = "0.22"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
secp256k1 = { version = "0.31", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
rmp-serde = "1"
buzz-identity = { path = "../identity" }
buzz-relay-client = { path = "../relay" }
secp256k1 = { version = "0.31", features = ["rand", "global-context"] }
tokio = { version = "1", features = ["full"] }

# Runs its own `main`: the agent controller re-executes the test binary as
# the agent supervisor, which libtest cannot dispatch.
[[test]]
name = "agent_e2e"
harness = false

[[test]]
name = "snapshot_e2e"
harness = false
