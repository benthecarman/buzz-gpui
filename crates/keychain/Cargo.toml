[package]
name = "buzz-keychain"
description = "The OS credential store: buzz-credential-store, with a macOS backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
buzz-credential-store.workspace = true
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# What buzz-credential-store reads the human key with on macOS.
security-framework = "3.7"
