[package]
name = "buzz-relay-client"
description = "Client for Buzz relays: WebSocket and HTTP transport, durable outbox, local store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
