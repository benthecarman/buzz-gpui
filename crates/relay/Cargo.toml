[package]
name = "buzz-relay-client"
description = "Client for Buzz relays: WebSocket and HTTP transport, durable outbox, local store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
buzz-desktop.workspace = true
buzz-identity = { path = "../identity" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
moxcms = "0.8"
markdown = "1"
percent-encoding = "2"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
secp256k1 = { version = "0.30", default-features = false, features = ["std"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
crc32fast = "1"
tempfile = "3"
# Test builds also trust `SSL_CERT_FILE`, for the test relay's own CA.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full", "test-util"] }
