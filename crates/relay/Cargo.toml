[package]
name = "buzz-relay-client"
description = "Client for Buzz relays: WebSocket and HTTP transport, durable outbox, local store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
buzz-identity = { path = "../identity" }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
markdown = "1"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
