[package]
name = "buzz-pair-mobile"
description = "Pair mobile: sends the human's Buzz account to a phone over NIP-AB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
buzz-identity = { path = "../identity" }
buzz-pairing.workspace = true
futures = "0.3"
# buzz-pairing's events and keys. Only this crate sees them; the human's
# key reaches it as an nsec from buzz-identity.
nostr-pairing = { package = "nostr", version = "0.44", features = ["nip44"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The app's other clients use aws-lc-rs. Pairing names it per connection,
# as buzz-app does, and must not enable a second provider: with two, the
# others can no longer pick a default.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
url = "2"
webpki-roots = "1"
zeroize = "1.9"

[dev-dependencies]
hex = "0.4"
# Scans the drawn QR code back, as a phone would.
rqrr = "0.9"
tokio = { version = "1", features = ["full", "test-util"] }
