[workspace]
members = ["crates/*"]
# Vendored crates are patched in, not developed here.
exclude = ["third_party"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
# buzz-app fork carrying one patch on `installed-runtime-tools`: the agent
# controller can use tools installed on PATH instead of a packaged bundle.
buzz-agent-controller = { git = "https://github.com/benthecarman/buzz-app", rev = "6958ff1fc2bf1dc682a9e445acdaaa020fb17a58" }
buzz-credential-store = { git = "https://github.com/benthecarman/buzz-app", rev = "6958ff1fc2bf1dc682a9e445acdaaa020fb17a58" }
gpui-kit = "=0.7.1"

# GPUI's Linux platform and gpui-kit's base crate with this app's patches;
# third_party/README.md lists them.
[patch.crates-io]
gpui-base = { path = "third_party/gpui-base" }
gpui-pre-linux = { path = "third_party/gpui-pre-linux" }
