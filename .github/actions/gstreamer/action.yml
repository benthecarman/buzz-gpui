name: Install GStreamer
description: >
  Installs GStreamer and pkg-config for building on macOS (Homebrew) or
  Windows (the official MSVC installers). On Windows it sets
  GSTREAMER_ROOT to the directory that holds bin/ and lib/.
runs:
  using: composite
  steps:
    - name: GStreamer (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install gstreamer pkgconf

    - name: GStreamer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "1.26.7"
        $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
        foreach ($name in "gstreamer-1.0-msvc-x86_64-$version.msi", "gstreamer-1.0-devel-msvc-x86_64-$version.msi") {
          Invoke-WebRequest "$base/$name" -OutFile "$env:RUNNER_TEMP\$name"
          $install = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$env:RUNNER_TEMP\$name`" /qn ADDLOCAL=ALL INSTALLDIR=C:\gstreamer"
          if ($install.ExitCode -ne 0) { throw "msiexec $name exited with $($install.ExitCode)" }
        }
        $root = (Get-ChildItem C:\gstreamer -Recurse -Filter gstreamer-1.0-0.dll | Select-Object -First 1).Directory.Parent.FullName
        if (-not $root) { throw "GStreamer did not install under C:\gstreamer" }
        Write-Host "GStreamer root: $root"
        "GSTREAMER_ROOT=$root" >> $env:GITHUB_ENV
        "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
        "$root\bin" >> $env:GITHUB_PATH
        # Strawberry Perl's pkg-config is on the runner's PATH; name ours.
        $pkgconfig = "$root\bin\pkg-config.exe"
        if (-not (Test-Path $pkgconfig)) {
          choco install pkgconfiglite --no-progress -y
          $pkgconfig = "C:\ProgramData\chocolatey\bin\pkg-config.exe"
        }
        "PKG_CONFIG=$pkgconfig" >> $env:GITHUB_ENV
